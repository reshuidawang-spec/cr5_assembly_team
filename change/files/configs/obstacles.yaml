# ================================================================
# 圆形减震工作台
# ================================================================
tables:
  left_damping:
    type: cylinder
    # cylinder('Damping_Table_Left', {-1.45, 0.45, 0.06}, 1.30, 0.12)
    # center.z ± height/2 = 0.06 ± 0.06 → [0, 0.12]
    center: [-1.45, 0.45, 0.06]
    radius: 1.30
    height: 0.12
    aabb:
      min: [-2.75, -0.85, 0.0]
      max: [-0.15, 1.75, 0.12]
    # 8 rubber pads: cylinder({x,y,0.03}, 0.07, 0.06), at r=1.05 around center
    # 这些很小，可忽略，但因为附在桌子组下会有位移
