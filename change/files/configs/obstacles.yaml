# ================================================================
# 传送带 (makeConveyor: 框架 + 皮带 + 滚轮 + 侧轨)
# ================================================================
conveyors:
  conveyor_good:
    # makeConveyor('Conveyor_Good', {1.35, -2.15, 0.18}, 2.50, 0.55, 'Y')
    # Frame: (1.35, -2.15, 0.18), size (0.55+0.12, 2.50, 0.16) = (0.67, 2.50, 0.16)
    #   → X: [1.015, 1.685], Y: [-3.40, -0.90], Z: [0.10, 0.26]
    # Belt: (1.35, -2.15, 0.28), size (0.55, 2.40, 0.035)
    #   → X: [1.075, 1.625], Y: [-3.35, -0.95], Z: [0.2625, 0.2975]
    # SideRail_Left: (1.35-0.55/2-0.05, -2.15, 0.36), size (0.04, 2.50, 0.08)
    #   = (1.025, -2.15, 0.36) → X: [1.005, 1.045], Y: [-3.40, -0.90], Z: [0.32, 0.40]
    # SideRail_Right: (1.35+0.55/2+0.05, -2.15, 0.36), size (0.04, 2.50, 0.08)
    #   = (1.675, -2.15, 0.36) → X: [1.655, 1.695], Y: [-3.40, -0.90], Z: [0.32, 0.40]
    center: [1.35, -2.15, 0.18]
    direction: Y
    aabb:
      min: [1.005, -3.40, 0.10]
      max: [1.695, -0.90, 0.40]

  conveyor_defect:
    # makeConveyor('Conveyor_Defect', {2.95, -0.55, 0.18}, 1.90, 0.55, 'X')
    # Frame: (2.95, -0.55, 0.18), size (1.90, 0.67, 0.16)
    #   → X: [2.00, 3.90], Y: [-0.885, -0.215], Z: [0.10, 0.26]
    # Belt: (2.95, -0.55, 0.28), size (1.80, 0.55, 0.035)
    #   → X: [2.05, 3.85], Y: [-0.825, -0.275], Z: [0.2625, 0.2975]
    # SideRail_Left: (2.95, -0.55-0.55/2-0.05, 0.36), size (1.90, 0.04, 0.08)
    #   = (2.95, -0.875, 0.36) → X: [2.00, 3.90], Y: [-0.895, -0.855], Z: [0.32, 0.40]
    # SideRail_Right: (2.95, -0.55+0.55/2+0.05, 0.36), size (1.90, 0.04, 0.08)
    #   = (2.95, -0.225, 0.36) → X: [2.00, 3.90], Y: [-0.245, -0.205], Z: [0.32, 0.40]
    center: [2.95, -0.55, 0.18]
    direction: X
    aabb:
      min: [2.00, -0.895, 0.10]
      max: [3.90, -0.205, 0.40]

